<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎 دانشنامه میوه و گیاه</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root { --p: #2e7d32; --bg: #f1f8e9; }
* { box-sizing: border-box; }
body { font-family: Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
.box { max-width: 700px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,.1); }
h1 { color: var(--p); text-align: center; font-size: 1.4em; margin-bottom: 5px; }
.hint { text-align: center; color: #666; font-size: .9em; margin-bottom: 15px; }
input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 10px; font-family: inherit; }
button { width: 100%; padding: 12px; background: var(--p); color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
button:disabled { background: #aaa; cursor: not-allowed; }
.btn-cmp { background: #ef6c00; }
#r { margin-top: 20px; line-height: 1.8; }
.card { margin-bottom: 15px; padding: 15px; background: #f9f9f9; border-radius: 10px; }
.card h2 { color: var(--p); margin: 0 0 5px; font-size: 1.1em; }
.cat { color: #888; font-size: .85em; margin: 0 0 10px; }
.n { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: .95em; }
.n:last-child { border-bottom: none; }
.n span:first-child { color: #555; }
.n span:last-child { font-weight: bold; color: #222; }
.n.max span { color: #1b5e20; font-weight: bold; }
.med { margin-top: 15px; padding: 15px; background: #e8f5e9; border-radius: 10px; }
.med h3 { color: var(--p); margin: 0 0 8px; font-size: 1em; }
.med small { color: #666; font-size: .8em; display: block; margin-top: 6px; font-style: italic; }
.err { color: #d32f2f; text-align: center; }
.load { color: #666; text-align: center; }
.chart-box { margin-top: 15px; padding: 15px; background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; }
.chart-box h3 { color: var(--p); margin: 0 0 10px; font-size: 1em; text-align: center; }
.cmp-title { text-align: center; color: #ef6c00; font-weight: bold; margin: 20px 0 10px; font-size: 1.1em; }
.cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp-item { text-align: center; padding: 12px 8px; background: #fff3e0; border-radius: 8px; font-size: .9em; line-height: 1.6; }
.cmp-item b { display: block; color: #e65100; margin-bottom: 8px; font-size: 1em; padding-bottom: 6px; border-bottom: 1px solid #ffcc80; }
.cmp-item .row { display: flex; justify-content: space-between; padding: 3px 0; }
.cmp-item .row span:last-child { font-weight: bold; color: #222; }
.cmp-hint { font-size: .85em; color: #777; text-align: center; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="box">
<h1>🍎🍊🥕 دانشنامه میوه و گیاه</h1>
<p class="hint">نام میوه یا گیاه را وارد کنید</p>

<input type="text" id="q" placeholder="نام را وارد کنید..." autocomplete="off">
<button id="b" onclick="go()">🔍 جستجو</button>

<button class="btn-cmp" onclick="toggleCompare()">⚖️ مقایسه دو میوه</button>
<div id="cmpHint" class="cmp-hint" style="display:none;">نام میوه دوم را وارد کنید و دکمه «مقایسه کن» را بزنید</div>
<div id="cmpBox" style="display:none;">
  <input type="text" id="q2" placeholder="میوه دوم برای مقایسه..." autocomplete="off">
  <button id="cmpBtn" onclick="goCompare()" style="background:#ef6c00;">⚖️ مقایسه کن</button>
</div>

<div id="r"></div>
</div>

  "بالنگ": "ضد نفخ، بهبود هضم، تقویت قلب و معده، آرام‌بخش، ضد سرفه، سلامت کبد",

  "به": "بهبود گوارش، ضد التهاب، تقویت ایمنی",

  "زالزالک": "سلامت قلب، کاهش فشار خون، آرام‌بخش",
  "کنار": "تقویت ایمنی، سلامت کبد، ضد التهاب",
  "شنبلیله": "کاهش قند خون، تقویت ایمنی، بهبود گوارش",
  "سیاه دانه": "تقویت ایمنی، ضد التهاب، سلامت کبد",
  "رازیانه": "بهبود گوارش، ضد نفخ، تقویت ایمنی",
  "زعفران": "ضد افسردگی، تقویت ایمنی، سلامت قلب",
  "گل محمدی": "آرام‌بخش، سلامت پوست، بهبود گوارش",
  "گل گاوزبان": "آرام‌بخش، ضد التهاب، سلامت کبد",
  "سنبل الطیب": "آرام‌بخش، بهبود خواب، کاهش اضطراب",
  "خار مریم": "سلامت کبد، سم‌زدایی، آنتی‌اکسیدان",
  "آلوئه ورا": "سلامت پوست، بهبود گوارش، تقویت ایمنی"
};

const NAME_FA = {
  "avocado": "آووکادو", "apple": "سیب", "orange": "پرتقال",
  "banana": "موز", "carrot": "هویج", "spinach": "اسفناج",
  "tomato": "گوجه", "cucumber": "خیار", "ginger": "زنجبیل",
  "turmeric": "زردچوبه", "garlic": "سیر", "pomegranate": "انار",
  "strawberry": "توت‌فرنگی", "kiwi": "کیوی", "lemon": "لیمو",
  "mango": "انبه", "pineapple": "آناناس", "watermelon": "هندوانه",
  "grape": "انگور", "cabbage": "کلم", "celery": "کرفس",
  "pepper": "فلفل دلمه", "eggplant": "بادمجان", "beet": "چغندر",
  "olive": "زیتون", "fig": "انجیر", "coconut": "نارگیل",
  "blueberry": "بلوبری", "chamomile": "بابونه", "cinnamon": "دارچین",
  "basil": "ریحان", "parsley": "جعفری", "thyme": "آویشن",
  "lavender": "اسطوخودوس", "pumpkin": "کدو تنبل", "zucchini": "کدو سبز",
  "squash": "کدو", "broccoli": "بروکلی", "cauliflower": "گل کلم",
  "lettuce": "کاهو", "onion": "پیاز", "potato": "سیب زمینی",
  "radish": "تربچه", "turnip": "شلغم", "mushroom": "قارچ",
  "corn": "ذرت", "mint": "نعنا", "dill": "شوید",
  "rosemary": "رزماری", "sage": "مریم گلی", "coriander": "گشنیز",
  "citron": "بالنگ", "persimmon": "خرمالو", "quince": "به",
  "medlar": "ازگیل", "hawthorn": "زالزالک", "jujube": "کنار",
  "fenugreek": "شنبلیله", "black seed": "سیاه دانه", "fennel": "رازیانه",
  "saffron": "زعفران", "rose": "گل محمدی", "borage": "گل گاوزبان",
  "valerian": "سنبل الطیب", "milk thistle": "خار مریم", "aloe vera": "آلوئه ورا"
};

const N = ["Energy","Protein","Total lipid (fat)","Carbohydrate, by difference","Fiber, total dietary","Water","Potassium, K","Calcium, Ca","Iron, Fe","Vitamin C, total ascorbic acid","Vitamin A, RAE"];

const C = ["Fruits and Fruit Juices","Vegetables and Vegetable Products","Nut and Seed Products","Spices and Herbs","Legumes and Legume Products"];

const tr = t => T[t] || t;

function faName(name) {
  if (!name) return "نامشخص";
  let lower = name.toLowerCase();
  lower = lower.replace(/, raw.*$/, "").replace(/, california.*$/, "")
    .replace(/, florida.*$/, "").replace(/, all commercial.*$/, "")
    .replace(/, hass.*$/, "").replace(/, peeled.*$/, "")
    .replace(/, fresh.*$/, "").replace(/^oil, /, "").trim();
  for (const [en, fa] of Object.entries(NAME_FA)) {
    if (lower.includes(en)) return fa;
  }
  return name;
}

let currentChart = null;
let currentChart2 = null;

async function fetchFruit(name) {
  const res = await fetch(`${API_URL}?name=${encodeURIComponent(name)}`);
  if (!res.ok) throw new Error('خطا در اتصال به سرور');
  const d = await res.json();
  if (!d.foods || d.foods.length === 0) return null;
  let valid = d.foods.filter(f => C.includes(f.foodCategory));
  if (valid.length === 0) valid = d.foods.slice(0, 1);
  const seen = new Set();
  const unique = [];
  for (const f of valid) {
    const fa = faName(f.description);
    if (!seen.has(fa) && fa !== "نامشخص") {
      seen.add(fa);
      unique.push(f);
    }
  }
  return unique.length > 0 ? unique[0] : valid[0];
}

function getNutrients(food) {
  const mp = {};
  (food.foodNutrients || []).forEach(n => { mp[n.nutrientName] = n; });
  const result = {};
  N.forEach(k => {
    if (mp[k]) {
      const n = mp[k];
      let val = parseFloat(n.value) || 0;
      if (k === "Energy" && n.unitName === "kJ") val = val / 4.184;
      result[k] = val;
    }
  });
  return result;
}

function renderFruitCard(food) {
  const nm = faName(food.description);
  const ct = tr(food.foodCategory || "");
  const mp = {};
  (food.foodNutrients || []).forEach(n => { mp[n.nutrientName] = n; });
  
  // پیدا کردن بیشترین ماده مؤثر
  let maxValue = 0;
  let maxNutrient = null;
  N.forEach(k => {
    if (mp[k]) {
      const val = parseFloat(mp[k].value) || 0;
      if (val > maxValue) {
        maxValue = val;
        maxNutrient = k;
      }
    }
  });
  
  let h = `<div class="card"><h2>📦 ${nm}</h2><p class="cat">📁 ${ct}</p>`;
  h += `<h3 style="color:#333;font-size:1em;">🍎 مواد مغذی (۱۰۰ گرم):</h3>`;
  
  N.forEach(k => {
    if (mp[k]) {
      const n = mp[k];
      let val = n.value || "?";
      let u = tr(n.unitName || "");
      if (k === "Energy" && n.unitName === "kJ") {
        val = (val / 4.184).toFixed(1);
        u = "کیلوکالری";
      }
      const cls = (k === maxNutrient) ? ' class="n max"' : ' class="n"';
      h += `<div${cls}><span>${tr(k)}</span><span>${val} ${u}</span></div>`;
    }
  });
  h += `</div>`;
  return h;
}

function renderChart(food) {
  if (currentChart) { currentChart.destroy(); currentChart = null; }
  if (currentChart2) { currentChart2.destroy(); currentChart2 = null; }
  
  const nutrients = getNutrients(food);
  const container = document.createElement('div');
  
  // نمودار درشت‌مغذی‌ها
  const macroLabels = [], macroValues = [];
  ["Protein", "Total lipid (fat)", "Carbohydrate, by difference", "Fiber, total dietary"].forEach(k => {
    if (nutrients[k] !== undefined) {
      macroLabels.push(tr(k));
      macroValues.push(nutrients[k]);
    }
  });
  
  if (macroValues.length > 0) {
    const canvas1 = document.createElement('canvas');
    canvas1.id = 'macroChart';
    const box1 = document.createElement('div');
    box1.className = 'chart-box';
    box1.innerHTML = '<h3>📊 درشت‌مغذی‌ها (گرم در ۱۰۰ گرم)</h3>';
    box1.appendChild(canvas1);
    container.appendChild(box1);
  }
  
  // نمودار ریزمغذی‌ها
  const microLabels = [], microValues = [];
  ["Vitamin C, total ascorbic acid", "Vitamin A, RAE", "Vitamin B-6", "Iron, Fe", "Calcium, Ca", "Potassium, K"].forEach(k => {
    if (nutrients[k] !== undefined) {
      microLabels.push(tr(k));
      microValues.push(nutrients[k]);
    }
  });
  
  if (microValues.length > 0) {
    const canvas2 = document.createElement('canvas');
    canvas2.id = 'microChart';
    const box2 = document.createElement('div');
    box2.className = 'chart-box';
    box2.innerHTML = '<h3>💊 ویتامین‌ها و مواد معدنی (میلی‌گرم در ۱۰۰ گرم)</h3>';
    box2.appendChild(canvas2);
    container.appendChild(box2);
  }
  
  return { container, macroLabels, macroValues, microLabels, microValues };
}

function renderCompare(food1, food2) {
  const n1 = getNutrients(food1);
  const n2 = getNutrients(food2);
  const name1 = faName(food1.description);
  const name2 = faName(food2.description);
  
  let max1 = 0, maxN1 = null;
  let max2 = 0, maxN2 = null;
  N.forEach(k => {
    if (n1[k] !== undefined && n1[k] > max1) { max1 = n1[k]; maxN1 = k; }
    if (n2[k] !== undefined && n2[k] > max2) { max2 = n2[k]; maxN2 = k; }
  });
  
  let h = `<div class="cmp-title">⚖️ مقایسه ${name1} و ${name2}</div>`;
  h += `<div class="cmp-grid">`;
  h += `<div class="cmp-item"><b>🥑 ${name1}</b>`;
  N.forEach(k => {
    if (n1[k] !== undefined) {
      const cls = (k === maxN1) ? ' style="font-weight:bold;color:#1b5e20;"' : '';
      h += `<div class="row"><span${cls}>${tr(k)}</span><span${cls}>${n1[k].toFixed(1)}</span></div>`;
    }
  });
  h += `</div>`;
  h += `<div class="cmp-item"><b>🥭 ${name2}</b>`;
  N.forEach(k => {
    if (n2[k] !== undefined) {
      const cls = (k === maxN2) ? ' style="font-weight:bold;color:#1b5e20;"' : '';
      h += `<div class="row"><span${cls}>${tr(k)}</span><span${cls}>${n2[k].toFixed(1)}</span></div>`;
    }
  });
  h += `</div></div>`;
  return h;
}

async function go() {
  const q = document.getElementById('q').value.trim();
  const r = document.getElementById('r');
  const b = document.getElementById('b');

  if (!q) {
    r.innerHTML = '<p class="err">لطفاً یک نام وارد کنید.</p>';
    return;
  }

  b.disabled = true;
  b.textContent = "در حال جستجو...";
  r.innerHTML = '<p class="load">⏳ لطفاً صبر کنید...</p>';

  try {
    const food = await fetchFruit(q);
    if (!food) {
      r.innerHTML = '<p class="err">❌ اطلاعاتی یافت نشد.</p>';
      return;
    }
    let h = renderFruitCard(food);
    if (M[q]) h += `<div class="med"><h3>💊 خواص دارویی ${q}:</h3><p>${M[q]}</p><small>⚠️ این اطلاعات از منابع طب سنتی و مطالعات علمی جمع‌آوری شده و جایگزین مشاوره پزشک نیست.</small></div>`;
    r.innerHTML = h;
    
    const chartData = renderChart(food);
    r.appendChild(chartData.container);
    
    setTimeout(() => {
      const ctx1 = document.getElementById('macroChart');
      if (ctx1 && chartData.macroValues.length > 0) {
        currentChart = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: chartData.macroLabels,
            datasets: [{
              label: 'گرم در ۱۰۰ گرم',
              data: chartData.macroValues,
              backgroundColor: ['#2e7d32', '#ef6c00', '#1565c0', '#6a1b9a'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { font: { family: 'Tahoma' } } },
              x: { ticks: { font: { family: 'Tahoma' } } }
            }
          }
        });
      }
      
      const ctx2 = document.getElementById('microChart');
      if (ctx2 && chartData.microValues.length > 0) {
        currentChart2 = new Chart(ctx2, {
          type: 'bar',
          data: {
            labels: chartData.microLabels,
            datasets: [{
              label: 'میلی‌گرم در ۱۰۰ گرم',
              data: chartData.microValues,
              backgroundColor: ['#c62828', '#f9a825', '#00838f', '#6a1b9a', '#2e7d32', '#1565c0'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, ticks: { font: { family: 'Tahoma' } } },
              x: { ticks: { font: { family: 'Tahoma' } } }
            }
          }
        });
      }
    }, 50);
  } catch (e) {
    r.innerHTML = `<p class="err">❌ ${e.message}</p>`;
  } finally {
    b.disabled = false;
    b.textContent = "🔍 جستجو";
  }
}

async function goCompare() {
  const q = document.getElementById('q').value.trim();
  const q2 = document.getElementById('q2').value.trim();
  const r = document.getElementById('r');
  const cmpBtn = document.getElementById('cmpBtn');

  if (!q) {
    r.innerHTML = '<p class="err">لطفاً نام میوه اول را وارد کنید.</p>';
    return;
  }
  if (!q2) {
    r.innerHTML = '<p class="err">لطفاً نام میوه دوم را هم وارد کنید.</p>';
    return;
  }

  cmpBtn.disabled = true;
  cmpBtn.textContent = "در حال مقایسه...";
  r.innerHTML = '<p class="load">⏳ لطفاً صبر کنید...</p>';

  try {
    const [f1, f2] = await Promise.all([fetchFruit(q), fetchFruit(q2)]);
    if (!f1 || !f2) {
      r.innerHTML = '<p class="err">❌ یکی از موارد یافت نشد.</p>';
      return;
    }
    let h = renderCompare(f1, f2);
    if (M[q]) h += `<div class="med"><h3>💊 خواص دارویی ${q}:</h3><p>${M[q]}</p></div>`;
    if (M[q2]) h += `<div class="med"><h3>💊 خواص دارویی ${q2}:</h3><p>${M[q2]}</p></div>`;
    r.innerHTML = h;
  } catch (e) {
    r.innerHTML = `<p class="err">❌ ${e.message}</p>`;
  } finally {
    cmpBtn.disabled = false;
    cmpBtn.textContent = "⚖️ مقایسه کن";
  }
}

function toggleCompare() {
  const cmpBox = document.getElementById('cmpBox');
  const cmpHint = document.getElementById('cmpHint');
  const isHidden = cmpBox.style.display === 'none';
  cmpBox.style.display = isHidden ? 'block' : 'none';
  cmpHint.style.display = isHidden ? 'block' : 'none';
}

document.getElementById('q').addEventListener('keypress', e => {
  if (e.key === 'Enter') go();
});
document.getElementById('q2')?.addEventListener('keypress', e => {
  if (e.key === 'Enter') goCompare();
});
</script>
